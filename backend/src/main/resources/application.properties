spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studio}
spring.datasource.username=${DB_USER:studio}
spring.datasource.password=${DB_PASSWORD:studio-local}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
server.error.include-message=always
studio.data=${DATA_DIR:/data}
studio.demo=${DEMO_ENABLED:false}
studio.cookie-secure=${COOKIE_SECURE:false}
mybatis.configuration.map-underscore-to-camel-case=true
